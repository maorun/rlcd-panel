name: CI

on:
  pull_request:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  host-tests:
    name: Host tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build and run host unit tests
        run: |
          c++ -std=c++17 -Wall -Wextra -Werror tests/test_firmware_logic.cpp -o "${RUNNER_TEMP}/test_runner"
          "${RUNNER_TEMP}/test_runner"

      - name: Build preview renderer and render all scenes
        run: |
          c++ -std=c++17 -Wall -Wextra -Werror tools/render_display_preview.cpp -o "${RUNNER_TEMP}/render_display_preview"
          mkdir -p "${RUNNER_TEMP}/previews"
          "${RUNNER_TEMP}/render_display_preview" --all "${RUNNER_TEMP}/previews"
          ls -l "${RUNNER_TEMP}/previews"

      - name: Check the sample config.ini
        run: |
          ./scripts/check-config.sh tools/sample_config.ini
          printf 'chime_volume_pct=abc\n' > "${RUNNER_TEMP}/bad.ini"
          status=0
          ./scripts/check-config.sh "${RUNNER_TEMP}/bad.ini" || status=$?
          test "${status}" -eq 1
          status=0
          ./scripts/check-config.sh "${RUNNER_TEMP}/missing.ini" || status=$?
          test "${status}" -eq 2

      - name: Self-test the dump-logs file name pattern
        run: ./scripts/dump-logs.sh --self-test

      - name: Check the protocol sync of the Wear OS and Android sources
        run: |
          ./scripts/check-protocol-sync.sh
          ./scripts/check-protocol-sync.sh --self-test

      - name: Test should-release-phone script
        run: |
          ./scripts/should-release-phone.sh --files "android/RlcdPhone/app/build.gradle.kts"
          ./scripts/should-release-phone.sh --files "docs/config.ini"
          ./scripts/should-release-phone.sh --files "docs/config.example.ini"
          ./scripts/should-release-phone.sh --files "rlcd_panel/device_config.h"
          exit_code=0
          ./scripts/should-release-phone.sh --files "rlcd_panel/sketch.yaml" "README.md" || exit_code=$?
          test "${exit_code}" -eq 1
          exit_code=0
          ./scripts/should-release-phone.sh --files "docs/board_buttons.png" || exit_code=$?
          test "${exit_code}" -eq 1

  macos-companion:
    name: macOS companion tests
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Run Swift tests
        working-directory: macos/RlcdCompanion
        run: swift test

      - name: Build release
        working-directory: macos/RlcdCompanion
        run: swift build -c release

  wearos-companion:
    name: Wear OS companion tests and APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Run unit tests and assemble debug APK
        working-directory: wearos/RlcdWatch
        run: gradle testDebugUnitTest assembleDebug

      - name: Upload Wear OS debug APK
        uses: actions/upload-artifact@v4
        with:
          name: rlcd-watch-debug-apk
          path: wearos/RlcdWatch/app/build/outputs/apk/debug/app-debug.apk

  android-phone-companion:
    name: Android phone companion tests and APK
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Determine version
        id: version
        run: |
          VERSION="1.0.${{ github.run_number }}"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "version_code=${{ github.run_number }}" >> "$GITHUB_OUTPUT"

      - name: Run unit tests and assemble debug APK
        working-directory: android/RlcdPhone
        run: gradle testDebugUnitTest assembleDebug -PversionCode=${{ steps.version.outputs.version_code }} -PversionName=${{ steps.version.outputs.version }}

      - name: Upload Android phone debug APK
        uses: actions/upload-artifact@v4
        with:
          name: rlcd-phone-debug-apk
          path: android/RlcdPhone/app/build/outputs/apk/debug/app-debug.apk

      - name: Check if phone release is needed
        id: release_check
        if: github.event_name == 'push' && github.ref == 'refs/heads/master'
        run: |
          if ./scripts/should-release-phone.sh "${{ github.event.before }}"; then
            echo "should_release=true" >> "$GITHUB_OUTPUT"
          else
            echo "should_release=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Create GitHub Release
        if: steps.release_check.outputs.should_release == 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="android-phone-v${{ steps.version.outputs.version }}"
          TITLE="RLCD Phone v${{ steps.version.outputs.version }}"
          APK_SRC="android/RlcdPhone/app/build/outputs/apk/debug/app-debug.apk"
          APK_DEST="rlcd-phone-v${{ steps.version.outputs.version }}.apk"
          cp "${APK_SRC}" "${APK_DEST}"
          if gh release view "${TAG}" >/dev/null 2>&1; then
            gh release upload "${TAG}" "${APK_SRC}" "${APK_DEST}" --clobber
          else
            gh release create "${TAG}" \
              "${APK_SRC}" \
              "${APK_DEST}" \
              --title "${TITLE}" \
              --notes "Android smartphone companion app for RLCD panel (v${{ steps.version.outputs.version }})."
          fi

  firmware-compile:
    name: Firmware compile
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: arduino/setup-arduino-cli@v2
        with:
          version: 1.5.1

      - name: Cache arduino-cli data directory
        uses: actions/cache@v4
        with:
          path: ~/.arduino15
          key: arduino-esp32-3.3.12-${{ runner.os }}-${{ hashFiles('rlcd_panel/sketch.yaml') }}
          restore-keys: |
            arduino-esp32-3.3.12-${{ runner.os }}-

      # The profile in sketch.yaml installs esp32:esp32@3.3.12 from its index URL.
      # rlcd_panel/wifi_config.h is optional and not part of the checkout.
      - name: Compile firmware
        run: arduino-cli compile --profile rlcd_panel_s3 rlcd_panel
