# config.ini template for rlcd-panel. Copy it to the root of the MicroSD card.
# Each active line shows the default value. A line with "# key=value" has no default.
# Check the file on the host: ./scripts/check-config.sh <file>

# Onboard SHTC3 temperature offset in degrees C. Range -10 to 10.
temp_offset_c=-1.9
# Onboard humidity offset in %RH. Range -10 to 10.
rh_offset_pct=0.0
# Freezer alert limit in degrees C. Range -20 to 15.
freeze_alert_limit_c=0.0
# Mold alert limit in %RH. Range 40 to 95.
mold_alert_limit_rh=70
# Chime volume in percent. Range 0 to 100.
chime_volume_pct=30
# First hour of the quiet hours. Range 0 to 23.
quiet_hours_start_hour=22
# Last hour of the quiet hours. Range 0 to 23.
quiet_hours_end_hour=7
# Microphone level offset in dB. Range -20 to 20.
mic_spl_offset_db=0.0
# Months to keep log files. Range 0 to 120. 0 keeps all files.
log_retention_months=0
# Noise alert limit in dB. 0 is off. Range 40 to 100.
noise_alert_limit_db=0
# Chime mask. Range 0 to 255. Bit 0 freezer, 1 humidity, 2 noise, 3 sensor lost, 4 charge full, 5 ventilate, 6 sensor battery, 7 heat.
chime_alert_mask=255
# Hours between two NTP syncs. Range 6 to 168.
ntp_sync_interval_h=24
# Seconds between two scans on battery power. Range 30 to 900.
wake_interval_s=60
# Minutes without a packet until a sensor is stale. Range 5 to 240.
sensor_stale_min=30
# Display invert. 0 is dark on light, 1 is light on dark.
display_invert=0
# Tiles that feed the freezer and mold alerts. Range 0 to 15. Bit 0 onboard, bits 1 to 3 slots.
climate_alert_tiles=15
# Battery voltage offset in mV. Range -300 to 300.
battery_offset_mv=0
# Slot of the outdoor sensor. Range 0 to 3. 0 switches the ventilation advice off.
outdoor_slot=0
# Humidity limit of the ventilation badge in %RH. Range 50 to 80.
ventilate_limit_rh=60
# Battery limit of an external sensor in percent. Range 0 to 50. 0 is off.
sensor_battery_limit_pct=10
# Hours without a packet until a slot without a fixed MAC is released. Range 0 to 168. 0 is off.
slot_release_h=0
# Seconds between two scans on battery power in the quiet hours. Range 60 to 1800. 0 uses wake_interval_s.
night_wake_interval_s=0
# Temperature unit on the screen and in STATUS. C or F. The card files, limits and alerts stay in Celsius.
temp_unit=C
# Hours until the chime of an alert that stays active sounds again. Range 0 to 24. 0 is off.
chime_repeat_h=0
# Feels-like temperature in degrees C at which the heat alert starts. Range 27 to 45. 0 is off. It releases 2 C below.
heat_alert_limit_c=0
# BLE telemetry of the four climate tiles after each scan. 0 is off, 1 is on. A low battery alert and the empty battery protection skip it.
ble_broadcast_enabled=0
# Slot 1 temperature offset in degrees C. Range -5 to 5.
slot1_temp_offset_c=0.0
# Slot 2 temperature offset in degrees C. Range -5 to 5.
slot2_temp_offset_c=0.0
# Slot 3 temperature offset in degrees C. Range -5 to 5.
slot3_temp_offset_c=0.0
# Slot 1 humidity offset in %RH. Range -10 to 10.
slot1_rh_offset_pct=0.0
# Slot 2 humidity offset in %RH. Range -10 to 10.
slot2_rh_offset_pct=0.0
# Slot 3 humidity offset in %RH. Range -10 to 10.
slot3_rh_offset_pct=0.0
# Name of the onboard tile. 1 to 12 characters of A-Z, 0-9, space and "-".
# onboard_name=OFFICE
# Name of the slot 1 tile. Same rules as onboard_name.
# slot1_name=BEDROOM
# Name of the slot 2 tile. Same rules as onboard_name.
# slot2_name=KITCHEN
# Name of the slot 3 tile. Same rules as onboard_name.
# slot3_name=OUTDOOR
# Fixed MAC of slot 1. Format AA:BB:CC:DD:EE:FF. Not all zero. Not in two slots.
# slot1_mac=AA:BB:CC:DD:EE:01
# Fixed MAC of slot 2. Same rules as slot1_mac.
# slot2_mac=AA:BB:CC:DD:EE:02
# Fixed MAC of slot 3. Same rules as slot1_mac.
# slot3_mac=AA:BB:CC:DD:EE:03
