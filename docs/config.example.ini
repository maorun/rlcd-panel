# config.ini template for rlcd-panel. Copy it to the root of the MicroSD card.
# Each active line shows the default value. A line with "# key=value" has no default.
# Check the file on the host: ./scripts/check-config.sh <file>
# The file limit is 8192 bytes. The parser rejects a larger file as a whole.

# Onboard SHTC3 temperature offset in degrees C. Range -10 to 10.
temp_offset_c=-1.9
# Added to temp_offset_c on USB power only. Range -5.0 to 0.0 in 0.1 steps.
usb_temp_offset_c=0.0
# Onboard humidity offset in %RH. Range -10 to 10.
rh_offset_pct=0.0
# Onboard humidity gain. Range 0.90 to 1.10 in 0.002 steps. Humidity = raw * gain + offset, clamped to 0 to 100 %RH.
rh_gain=1.0
# Freezer alert limit in degrees C. Range -20 to 15.
freeze_alert_limit_c=0.0
# Mold alert limit in %RH. Range 40 to 95.
mold_alert_limit_rh=70
# Chime volume in percent. Range 0 to 100.
chime_volume_pct=30
# First hour of the quiet hours. Range 0 to 23.
quiet_hours_start_hour=22
# Last hour of the quiet hours. Range 0 to 23.
quiet_hours_end_hour=7
# Microphone level offset in dB. Range -20 to 20.
mic_spl_offset_db=0.0
# Months to keep log files. Range 0 to 120. 0 keeps all files.
log_retention_months=0
# Noise alert limit in dB. 0 is off. Range 40 to 100.
noise_alert_limit_db=0
# Chime mask. Range 0 to 255. Bit 0 freezer, 1 humidity, 2 noise, 3 sensor lost, 4 charge full, 5 ventilate, 6 sensor battery, 7 heat.
chime_alert_mask=255
# Hours between two NTP syncs. Range 6 to 168.
ntp_sync_interval_h=24
# Seconds between two scans on battery power. Range 30 to 900.
wake_interval_s=60
# Minutes without a packet until a sensor is stale. Range 5 to 240.
sensor_stale_min=30
# Display invert. 0 is dark on light, 1 is light on dark.
display_invert=0
# Tiles that feed the freezer and mold alerts. Range 0 to 2047. Bit 0 onboard, bits 1 to 10 slots.
climate_alert_tiles=2047
# Battery voltage offset in mV. Range -300 to 300.
battery_offset_mv=0
# Slot of the outdoor sensor. Range 0 to 10. 0 switches the ventilation advice off.
outdoor_slot=0
# Reference slot for door ventilation of slot 1. Range 0 to 10. 0 is off.
door_ref_slot=0
# Humidity limit of the ventilation badge in %RH. Range 50 to 80.
ventilate_limit_rh=60
# Battery limit of an external sensor in percent. Range 0 to 50. 0 is off.
sensor_battery_limit_pct=10
# Hours without a packet until a slot without a fixed MAC is released. Range 0 to 168. 0 is off.
slot_release_h=0
# Seconds between two scans on battery power in the quiet hours. Range 60 to 1800. 0 uses wake_interval_s.
night_wake_interval_s=0
# Temperature unit on the screen and in STATUS. C or F. The card files, limits and alerts stay in Celsius.
temp_unit=C
# Hours until the chime of an alert that stays active sounds again. Range 0 to 24. 0 is off.
chime_repeat_h=0
# Feels-like temperature in degrees C at which the heat alert starts. Range 27 to 45. 0 is off. It releases 2 C below.
heat_alert_limit_c=0
# Dry air badge "D" at or below this %RH. Range 20 to 45. 0 is off. Releases 3 %RH above. No chime.
dry_alert_limit_rh=0
# Open window badge "W" when a tile falls by this many C within 15 minutes. Range 1.0 to 5.0. 0 is off. Releases when the tile rises by half the limit or after 2 hours. No chime. A wake interval above 15 minutes (also night_wake_interval_s) widens the 15 minute window.
window_drop_c=0
# Temperature factor of the outer wall in percent for the WALL text of the stats view. Range 50 to 95. 0 is off.
wall_frsi_pct=0
# BLE telemetry of the climate tiles after each scan. 0 is off, 1 is on. Default 1. A low battery skips it.
ble_broadcast_enabled=1
# BLE console on USB power. 0 is off, 1 allows the read commands, 2 also allows SET. DUMP and SCAN never run over BLE.
ble_console=0
# New MAC handling. 1 gives the first free slot to each new MAC. 0 lets only a slot with a fixed MAC (slotN_mac) take a reading. Other MACs count as unassigned in STATUS.
slot_auto_assign=1
# Weakest RSSI in dBm at which a new MAC takes a free slot. Range -100 to -40. 0 is off. A weaker new MAC counts as WEAK in REJECTS. A slot that holds the MAC and a fixed MAC slot ignore it.
auto_assign_min_rssi=0
# Delay of the humidity alert in hours. Range 1 to 12. 0 is off. With N the alert rises only when the reading and the newest N hourly samples of the tile are above mold_alert_limit_rh. Fewer than N samples give no rise. The release does not change.
mold_alert_delay_h=0
# Reception rate in percent below which the R badge of a slot sets. Range 30 to 80. 0 is off. The badge releases at this value plus 20. A far sensor with a low rate needs a lower limit.
reception_low_pct=50
# Slot activation. 1 enables the slot, 0 disables and hides it completely.
slot1_enabled=1
slot2_enabled=1
slot3_enabled=1
slot4_enabled=1
slot5_enabled=1
slot6_enabled=1
slot7_enabled=1
slot8_enabled=1
slot9_enabled=1
slot10_enabled=1
# Temperature offset of slot 1 to 10 in degrees C. Range -5 to 5.
slot1_temp_offset_c=0.0
slot2_temp_offset_c=0.0
slot3_temp_offset_c=0.0
slot4_temp_offset_c=0.0
slot5_temp_offset_c=0.0
slot6_temp_offset_c=0.0
slot7_temp_offset_c=0.0
slot8_temp_offset_c=0.0
slot9_temp_offset_c=0.0
slot10_temp_offset_c=0.0
# Humidity offset of slot 1 to 10 in %RH. Range -10 to 10.
slot1_rh_offset_pct=0.0
slot2_rh_offset_pct=0.0
slot3_rh_offset_pct=0.0
slot4_rh_offset_pct=0.0
slot5_rh_offset_pct=0.0
slot6_rh_offset_pct=0.0
slot7_rh_offset_pct=0.0
slot8_rh_offset_pct=0.0
slot9_rh_offset_pct=0.0
slot10_rh_offset_pct=0.0
# Humidity gain of slot 1 to 10. Same rules as rh_gain.
slot1_rh_gain=1.0
slot2_rh_gain=1.0
slot3_rh_gain=1.0
slot4_rh_gain=1.0
slot5_rh_gain=1.0
slot6_rh_gain=1.0
slot7_rh_gain=1.0
slot8_rh_gain=1.0
slot9_rh_gain=1.0
slot10_rh_gain=1.0
# Name of the onboard tile. 1 to 12 characters of A-Z, 0-9, space and "-".
# onboard_name=OFFICE
# A slot name belongs to the sensor with the fixed MAC of the same slot (slotN_mac).
# Without slotN_mac the name never shows: the sensor then keeps the default title.
# Name of the slot 1 tile. Same rules as onboard_name.
# slot1_name=BEDROOM
# Name of slot 2 and 3. Same rules as onboard_name.
# slot2_name=KITCHEN
# slot3_name=OUTDOOR
# Name of slot 4 and 5. Same rules as onboard_name.
# slot4_name=GARAGE
# slot5_name=ATTIC
# Name of slot 6 to 10. Same rules as onboard_name.
# slot6_name=BALCONY
# slot7_name=BASEMENT
# slot8_name=OFFICE 2
# slot9_name=GREENHOUSE
# slot10_name=SHED
# Fixed MAC of slot 1. Format AA:BB:CC:DD:EE:FF. Not all zero. Not in two slots.
# slot1_mac=AA:BB:CC:DD:EE:01
# Fixed MAC of slot 2 and 3. Same rules as slot1_mac.
# slot2_mac=AA:BB:CC:DD:EE:02
# slot3_mac=AA:BB:CC:DD:EE:03
# Fixed MAC of slot 4 and 5. Same rules as slot1_mac.
# slot4_mac=AA:BB:CC:DD:EE:04
# slot5_mac=AA:BB:CC:DD:EE:05
# Fixed MAC of slot 6 to 10. Same rules as slot1_mac.
# slot6_mac=AA:BB:CC:DD:EE:06
# slot7_mac=AA:BB:CC:DD:EE:07
# slot8_mac=AA:BB:CC:DD:EE:08
# slot9_mac=AA:BB:CC:DD:EE:09
# slot10_mac=AA:BB:CC:DD:EE:0A
